name: Temporary lockfile resolution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve isolated dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Create isolated generic pnpm workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lockgen-js/apps/web"
          cat > "$RUNNER_TEMP/lockgen-js/package.json" <<'JSON'
          {
            "name": "lockgen",
            "private": true,
            "packageManager": "pnpm@12.6.0",
            "engines": {"node": ">=22.13"},
            "devDependencies": {"prettier": "^3.9.9"}
          }
          JSON
          cat > "$RUNNER_TEMP/lockgen-js/pnpm-workspace.yaml" <<'YAML'
          packages:
            - apps/*
          allowBuilds:
            unrs-resolver: true
          YAML
          cat > "$RUNNER_TEMP/lockgen-js/apps/web/package.json" <<'JSON'
          {
            "name": "web",
            "version": "0.1.0",
            "private": true,
            "dependencies": {
              "next": "^16.3.6",
              "react": "^19.3.0",
              "react-dom": "^19.3.0"
            },
            "devDependencies": {
              "@types/node": "^22.20.4",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "eslint": "^9.39.1",
              "eslint-config-next": "^16.3.6",
              "typescript": "^5.9.3",
              "vitest": "^5.0.2"
            }
          }
          JSON

      - uses: pnpm/action-setup@v4
        with:
          version: "12.6.0"
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.16.0"

      - name: Resolve pnpm lockfile
        shell: bash
        run: cd "$RUNNER_TEMP/lockgen-js" && pnpm install --lockfile-only

      - name: Create isolated generic uv workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lockgen-py/packages/"{core,adapters,analytics,experiments,risk}
          mkdir -p "$RUNNER_TEMP/lockgen-py/services/"{api,collector,scheduler,research-worker,research-agent,mcp}
          cat > "$RUNNER_TEMP/lockgen-py/pyproject.toml" <<'TOML'
          [project]
          name = "lock-workspace"
          version = "0.0.0"
          requires-python = ">=3.12"
          dependencies = [
            "lock-core>=0.1.0",
            "lock-adapters>=0.1.0",
            "lock-analytics>=0.1.0",
            "lock-experiments>=0.1.0",
            "lock-risk>=0.1.0",
            "lock-api>=0.1.0",
            "lock-collector>=0.1.0",
            "lock-scheduler>=0.1.0",
            "lock-research-worker>=0.1.0",
            "lock-research-agent>=0.1.0",
            "lock-mcp>=0.1.0",
          ]
          [dependency-groups]
          dev = ["mypy>=1.18", "pytest>=8.4", "ruff>=0.16.9"]
          [tool.uv]
          package = false
          [tool.uv.workspace]
          members = ["packages/*", "services/*"]
          [tool.uv.sources]
          lock-core = { workspace = true }
          lock-adapters = { workspace = true }
          lock-analytics = { workspace = true }
          lock-experiments = { workspace = true }
          lock-risk = { workspace = true }
          lock-api = { workspace = true }
          lock-collector = { workspace = true }
          lock-scheduler = { workspace = true }
          lock-research-worker = { workspace = true }
          lock-research-agent = { workspace = true }
          lock-mcp = { workspace = true }
          TOML
          LOCKGEN_PY="$RUNNER_TEMP/lockgen-py" python - <<'PY'
          import os
          from pathlib import Path

          members = {
              "packages/core": ("lock-core", []),
              "packages/adapters": ("lock-adapters", ["lock-core>=0.1.0"]),
              "packages/analytics": ("lock-analytics", ["lock-core>=0.1.0"]),
              "packages/experiments": ("lock-experiments", ["lock-core>=0.1.0", "lock-analytics>=0.1.0"]),
              "packages/risk": ("lock-risk", ["lock-core>=0.1.0"]),
              "services/api": ("lock-api", ["lock-core>=0.1.0"]),
              "services/collector": ("lock-collector", ["lock-core>=0.1.0", "lock-adapters>=0.1.0"]),
              "services/scheduler": ("lock-scheduler", ["lock-core>=0.1.0"]),
              "services/research-worker": ("lock-research-worker", ["lock-core>=0.1.0", "lock-analytics>=0.1.0", "lock-experiments>=0.1.0"]),
              "services/research-agent": ("lock-research-agent", ["lock-core>=0.1.0", "lock-analytics>=0.1.0", "lock-experiments>=0.1.0"]),
              "services/mcp": ("lock-mcp", ["lock-core>=0.1.0"]),
          }
          root = Path(os.environ["LOCKGEN_PY"])
          for rel, (name, deps) in members.items():
              path = root / rel
              path.mkdir(parents=True, exist_ok=True)
              lines = [
                  "[project]",
                  f'name = "{name}"',
                  'version = "0.1.0"',
                  'requires-python = ">=3.12"',
                  "dependencies = [" + ", ".join(repr(dep) for dep in deps) + "]",
              ]
              if deps:
                  lines.extend(["", "[tool.uv.sources]"])
                  lines.extend(
                      f'{dep.split(">=")[0]} = {{ workspace = true }}'
                      for dep in deps
                  )
              path.joinpath("pyproject.toml").write_text("\n".join(lines) + "\n")
          PY

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Resolve uv lockfile
        shell: bash
        run: cd "$RUNNER_TEMP/lockgen-py" && uv lock

      - name: Emit lockfiles for connector transfer
        shell: bash
        run: |
          set -euo pipefail
          echo "PNPM_LOCK_B64_BEGIN"
          base64 -w0 "$RUNNER_TEMP/lockgen-js/pnpm-lock.yaml"
          echo
          echo "PNPM_LOCK_B64_END"
          echo "UV_LOCK_B64_BEGIN"
          base64 -w0 "$RUNNER_TEMP/lockgen-py/uv.lock"
          echo
          echo "UV_LOCK_B64_END"
